<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip</title><link rel="stylesheet" href="assets/style.css?v=20260904-0060"><link rel="stylesheet" href="assets/trip-summary.css?v=20260904-0060">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="index.html">✦ TRAVEL LOG</a><div class="spacer"></div>
<button id="editTrip" class="edit-icon admin-only hidden" aria-label="여행 수정" title="여행 수정">✎</button><button id="deleteTrip" class="ghost danger admin-only hidden">여행 삭제</button></header>
<main class="shell"><section id="tripHero" class="trip-hero"></section>
<section class="trip-flow-section"><div class="section-head"><h3>여행 전체 흐름</h3><button id="addDay" class="mini admin-only hidden">+ 날짜</button></div><p id="tripFlowText" class="trip-flow-text"></p><div id="timeline" class="hidden"></div></section>
<section class="wishlist-section"><div class="section-head"><h2>📌 가고 싶은 곳</h2><button id="addWishlist" class="mini hidden">+ 링크 추가</button></div><div id="wishlistList" class="wishlist-list"></div></section>
<section><div class="section-head"><h2>📅 전체 일정 요약</h2><span class="muted">날짜를 누르면 상세 일정으로 이동합니다.</span></div><div id="staySummary"></div><div id="dayCards" class="day-list"></div></section></main>
<div id="dayModal" class="modal hidden"><form id="dayForm" class="dialog"><div class="dialog-head"><h2>날짜 추가</h2><button type="button" class="icon" data-close>×</button></div><label>날짜<input name="date" type="date" required></label><label>도시 / 지역<input name="place"></label><label>요약<textarea name="summary"></textarea></label><p class="muted small">제목은 날짜순으로 Day 1, Day 2… 자동 생성됩니다.</p><button class="primary full">추가</button></form></div>
<div id="wishlistModal" class="modal wishlist-modal hidden"><form id="wishlistForm" class="dialog"><div class="dialog-head"><h2>가고 싶은 곳 추가</h2><button type="button" class="icon" data-wishlist-close>×</button></div><label>이름<input name="name" required placeholder="카페, 맛집, 관광지 등"></label><label>링크<input name="url" type="url" placeholder="https://..."></label><label>메모<textarea name="note" placeholder="왜 가고 싶은지, 예약 정보 등"></textarea></label><button class="primary full">추가</button></form></div>
<div id="editTripModal" class="modal hidden"><form id="editTripForm" class="dialog"><div class="dialog-head"><h2>여행 수정</h2><button type="button" class="icon" data-close>×</button></div><label>여행 이름<input name="title" required></label><label>시작일<input name="start_date" type="date" required></label><label>종료일<input name="end_date" type="date" required></label><label>여행 동선<input name="route"></label><label>한 줄 소개<textarea name="summary"></textarea></label><button class="primary full">저장</button></form></div>
<script src="assets/app.js?v=20260904-0030"></script><script src="assets/trip-summary.js?v=20260904-0030"></script><script src="assets/ensure-days.js?v=20260904-0030"></script><script src="assets/wishlist.js?v=20260904-0060"></script><script>(async()=>{const ensured=await EnsureDays.run();await TravelApp.trip();await TripSummary.init();await TripWishlist.init();if(ensured?.created>0)console.info(`자동 Day ${ensured.created}개 생성 완료`)})()</script></body></html>
