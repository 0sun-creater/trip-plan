<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day</title><link rel="stylesheet" href="assets/style.css?v=20260903-8"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>.note-compose{display:flex;gap:10px;align-items:flex-end;margin-bottom:18px}.note-compose textarea{flex:1;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fbfaf7}.note-compose .primary{flex:0 0 auto}.note-list{display:flex;flex-direction:column;gap:10px}.note-card{background:#fbfaf7;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.note-card p{margin:0;white-space:pre-wrap;word-break:break-word}.note-time{margin-top:8px;font-size:11px;color:var(--sub)}#notes{display:none!important}@media(max-width:580px){.note-compose{display:block}.note-compose .primary{width:100%;margin-top:8px}}</style></head>
<body><header class="topbar"><a class="brand" href="index.html">✦ TRAVEL LOG</a><a id="backTrip" class="ghost linkbtn">← 여행 전체</a><div class="spacer"></div><button id="editDay" class="edit-icon admin-only hidden" aria-label="날짜 수정" title="날짜 수정">✎</button><button id="deleteDay" class="ghost danger admin-only hidden">날짜 삭제</button></header>
<main class="shell narrow"><section id="dayHeader" class="day-header"></section><section class="editor-card route-overview"><div class="section-head"><h2>🗺️ 오늘 전체 동선</h2></div><div id="dayRoute"></div></section><section class="editor-card"><div class="section-head"><h2>⏱️ 시간별 상세 동선</h2><button id="addItem" class="primary mini admin-only hidden">+ 일정 추가</button></div><p class="drag-help admin-only hidden">PC에서는 ⋮⋮를 끌어서, 휴대폰에서는 일정 카드를 꾹 누른 뒤 위아래로 이동하세요.</p><div id="schedule" class="schedule timeline-detail"></div></section><section class="editor-card"><div class="section-head"><h2>메모</h2></div><textarea id="notes"></textarea><div class="note-compose admin-only hidden" id="noteCompose"><textarea id="noteInput" placeholder="메모를 입력하세요."></textarea><button id="saveNotes" class="primary">+ 메모 추가</button></div><div id="noteList" class="note-list"></div><p id="saveState" class="muted small"></p></section></main>
<div id="itemModal" class="modal hidden"><form id="itemForm" class="dialog"><div class="dialog-head"><h2>일정 추가</h2><button type="button" class="icon" data-close>×</button></div><label>대략 시간<input name="time_label" type="text" placeholder="오전, 점심쯤, 15:30, 도착 후"></label><label>일정<input name="title" required placeholder="카페, 이동, 관광 정도로 대충 적어도 돼요"></label><label>장소<input name="place" placeholder="장소를 적으면 오늘 전체 동선에 자동 반영돼요"></label><label>설명<textarea name="detail" placeholder="이동 방법, 예약 메모, 할 일 등"></textarea></label><label>예상 비용<input name="cost" type="text" placeholder="예: 30,000원 / €30~50 / 미정"></label><label>지도 URL<input name="map_url" type="url"></label><button class="primary full">추가</button></form></div>
<div id="editDayModal" class="modal hidden"><form id="editDayForm" class="dialog"><div class="dialog-head"><h2>날짜 수정</h2><button type="button" class="icon" data-close>×</button></div><label>날짜<input name="date" type="date" required></label><label>도시 / 지역<input name="place"></label><label>요약<textarea name="summary"></textarea></label><button class="primary full">저장</button></form></div>
<div id="editItemModal" class="modal hidden"><form id="editItemForm" class="dialog"><div class="dialog-head"><h2>일정 수정</h2><button type="button" class="icon" data-close>×</button></div><input name="id" type="hidden"><label>대략 시간<input name="time_label" type="text" placeholder="오전, 점심쯤, 15:30, 도착 후"></label><label>일정<input name="title" required></label><label>장소<input name="place"></label><label>설명<textarea name="detail"></textarea></label><label>예상 비용<input name="cost" type="text" placeholder="예: 30,000원 / €30~50 / 미정"></label><label>지도 URL<input name="map_url" type="url"></label><div class="dialog-actions"><button type="button" id="deleteItem" class="ghost danger">삭제</button><button class="primary">저장</button></div></form></div>
<script src="assets/app.js?v=20260903-8"></script><script>TravelApp.day();(()=>{const cfg=window.TRAVEL_CONFIG||{},client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY),did=new URLSearchParams(location.search).get('day'),hidden=document.getElementById('notes'),input=document.getElementById('noteInput'),list=document.getElementById('noteList'),save=document.getElementById('saveNotes'),state=document.getElementById('saveState');function parse(raw){if(!raw||!raw.trim())return[];try{const a=JSON.parse(raw);if(Array.isArray(a))return a.map(x=>typeof x==='string'?{text:x,created_at:null}:x).filter(x=>x&&x.text)}catch(e){}return[{text:raw,created_at:null}]}function render(raw){const notes=parse(raw);list.innerHTML='';if(!notes.length){const e=document.createElement('div');e.className='muted small';e.textContent='아직 메모가 없습니다.';list.appendChild(e);return}notes.forEach(n=>{const card=document.createElement('div');card.className='note-card';const p=document.createElement('p');p.textContent=n.text;card.appendChild(p);if(n.created_at){const tm=document.createElement('div');tm.className='note-time';tm.textContent=new Date(n.created_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});card.appendChild(tm)}list.appendChild(card)})}async function load(){const {data}=await client.from('days').select('notes').eq('id',did).single();const raw=data?.notes||'';hidden.value=raw;render(raw)}save.addEventListener('click',async e=>{e.preventDefault();e.stopImmediatePropagation();const text=input.value.trim();if(!text)return;save.disabled=true;state.textContent='저장 중...';const notes=parse(hidden.value);notes.push({text,created_at:new Date().toISOString()});const raw=JSON.stringify(notes);const {error}=await client.from('days').update({notes:raw}).eq('id',did);save.disabled=false;if(error){state.textContent=error.message;return}hidden.value=raw;input.value='';state.textContent='등록됨';render(raw)},true);setTimeout(load,250)})();(()=>{const box=document.getElementById('dayRoute');if(!box)return;const clean=()=>{const line=box.querySelector('.route-line');if(!line)return;const seen=new Set();const parts=line.textContent.split('→').map(v=>v.trim()).filter(Boolean).filter(v=>{const key=v.replace(/\s+/g,' ').toLocaleLowerCase();if(seen.has(key))return false;seen.add(key);return true});const next=parts.join(' → ');if(line.textContent.trim()!==next)line.textContent=next};new MutationObserver(clean).observe(box,{childList:true,subtree:true,characterData:true});clean()})();</script><script src="assets/reorder.js?v=20260903-8"></script></body></html>
