<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><header class="topbar"><a class="brand" href="index.html">✦ TRAVEL LOG</a><a id="backTrip" class="ghost linkbtn">← 여행 전체</a><div class="spacer"></div><button id="editDay" class="ghost admin-only hidden">날짜 수정</button><button id="deleteDay" class="ghost danger admin-only hidden">날짜 삭제</button></header>
<main class="shell narrow"><section id="dayHeader" class="day-header"></section><section class="editor-card"><div class="section-head"><h2>상세 일정</h2><button id="addItem" class="primary mini admin-only hidden">+ 일정 추가</button></div><div id="schedule" class="schedule"></div></section><section class="editor-card"><div class="section-head"><h2>메모</h2><button id="saveNotes" class="primary admin-only hidden">메모 저장</button></div><textarea id="notes" class="notes" placeholder="예약번호, 교통 팁, 준비물 등을 적어두세요."></textarea><p id="saveState" class="muted small"></p></section></main>
<div id="itemModal" class="modal hidden"><form id="itemForm" class="dialog"><div class="dialog-head"><h2>일정 추가</h2><button type="button" class="icon" data-close>×</button></div><label>시간<input name="time" type="time"></label><label>일정<input name="title" required></label><label>장소<input name="place"></label><label>설명<textarea name="detail"></textarea></label><label>지도 URL<input name="map_url" type="url"></label><button class="primary full">추가</button></form></div>
<div id="editDayModal" class="modal hidden"><form id="editDayForm" class="dialog"><div class="dialog-head"><h2>날짜 수정</h2><button type="button" class="icon" data-close>×</button></div><label>날짜<input name="date" type="date" required></label><label>도시 / 지역<input name="place"></label><label>제목<input name="title" required></label><label>요약<textarea name="summary"></textarea></label><button class="primary full">저장</button></form></div>
<div id="editItemModal" class="modal hidden"><form id="editItemForm" class="dialog"><div class="dialog-head"><h2>일정 수정</h2><button type="button" class="icon" data-close>×</button></div><input name="id" type="hidden"><label>시간<input name="time" type="time"></label><label>일정<input name="title" required></label><label>장소<input name="place"></label><label>설명<textarea name="detail"></textarea></label><label>지도 URL<input name="map_url" type="url"></label><button class="primary full">저장</button></form></div>
<script src="assets/app.js"></script><script>TravelApp.day()</script></body></html>
